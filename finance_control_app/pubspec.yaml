flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  drift_dev: ^2.13.1
